[project]
name = "health-converter"
version = "0.1.0"
description = "Health data import/export bridge — Withings CSV to Strava GPX (and more)"
readme = "README.md"
requires-python = ">=3.14.5"
dependencies = [
    "gpxpy>=1.6.2",
    "pandas>=3.0.2",
    "pydantic>=2.13",
]

[project.scripts]
health_bridge = "cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["health_bridge"]


